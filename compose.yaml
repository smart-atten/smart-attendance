services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: attendance
      MYSQL_USER: attendance
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
      - ./backend/src/main/resources/course_catalog.sql:/docker-entrypoint-initdb.d/03-course-catalog.sql:ro
volumes:
  mysql_data:
