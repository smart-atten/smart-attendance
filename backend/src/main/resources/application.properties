spring.application.name=attendance-server
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/attendance?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:attendance}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
server.error.include-message=never
